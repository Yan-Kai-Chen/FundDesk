[project]
name = "funding-workbench"
version = "0.22.0"
description = "Local fund observation, ledger and prediction workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
packaging = [
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
addopts = "-q"
cache_dir = "../../data/cache/pytest"
